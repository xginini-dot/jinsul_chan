<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JINSUL 병원 관리 허브</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#292929;--muted:#777;--line:#e8e3d9;--gold:#b79b67;--gold2:#8f7548;--shadow:0 10px 30px rgba(35,35,35,.08);--danger:#a74646}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:34px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:18px}.logo{width:178px;max-height:70px;object-fit:contain}.title h1{margin:0;font-size:25px;letter-spacing:-.6px}.title p{margin:6px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;margin:0 0 22px}.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:15px;outline:none;box-shadow:0 3px 14px rgba(0,0,0,.025)}.search:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);transition:.18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(35,35,35,.11)}.num{font-size:12px;color:var(--gold2);font-weight:800;letter-spacing:.7px}.name{font-size:19px;font-weight:800;margin:8px 0 5px;letter-spacing:-.4px}.desc{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:750;border:1px solid #d9d1c2;color:#4b4030;background:#faf8f4;cursor:pointer}.btn:hover{background:#f0eadf;border-color:#c8b998}.btn.primary{background:#34322e;color:#fff;border-color:#34322e}.btn.primary:hover{background:#1f1e1b}.btn.gold{background:#b79b67;color:#fff;border-color:#b79b67}.btn.danger{color:var(--danger);border-color:#e7caca;background:#fffafa}.empty{display:none;text-align:center;color:var(--muted);padding:50px 0}.foot{margin-top:28px;color:#96918a;font-size:12px;text-align:center}.editbar{display:none;background:#fff8ea;border:1px solid #ead8b8;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:#6c5837;align-items:center;justify-content:space-between;gap:10px}.editing .editbar{display:flex}.edit-card-actions{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);gap:7px;flex-wrap:wrap}.editing .edit-card-actions{display:flex}.modal{position:fixed;inset:0;background:rgba(20,20,20,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.panel{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.panel h2{margin:0 0 18px;font-size:21px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:#6d655b;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.field input:focus{border-color:var(--gold)}.linkrow{border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0;background:#faf9f6}.linkgrid{display:grid;grid-template-columns:1fr 2fr;gap:8px}.row-actions{display:flex;gap:7px;margin-top:8px;align-items:center}.check{display:flex;gap:7px;align-items:center;font-size:12px;color:#666}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}.right{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:12px;color:#888;line-height:1.55;margin-top:10px}.toast{position:fixed;right:22px;bottom:22px;background:#292929;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.wrap{padding:24px 15px 40px}.grid{grid-template-columns:1fr}.logo{width:150px}.title h1{font-size:21px}.linkgrid{grid-template-columns:1fr}.editbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand">
      <img class="logo" src="https://xginini-dot.github.io/jinsul_v1.0/%EC%A7%84%EC%84%A4%EB%A1%9C%EA%B3%A0.png" alt="JINSUL Logo" onerror="this.style.display='none'">
      <div class="title"><h1>병원 관리 허브</h1><p>병원별 관리 문서 및 스프레드시트 바로가기</p></div>
    </div>
    <div class="top-actions">
      <button class="btn" id="editToggle">편집 모드</button>
      <button class="btn" id="exportBtn">설정 내보내기</button>
      <button class="btn" id="importBtn">설정 가져오기</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="editbar"><span><b>편집 모드</b> · 병원/링크를 화면에서 수정하면 이 브라우저에 자동 저장됩니다.</span><button class="btn gold" id="addHospital">+ 병원 추가</button></div>
  <div class="toolbar"><input id="search" class="search" placeholder="병원명을 검색하세요" autocomplete="off"></div>
  <main id="grid" class="grid"></main>
  <div id="empty" class="empty">검색 결과가 없습니다.</div>
  <div class="foot">JINSUL · 경험과 가치를 현실화 하는 컨설팅</div>
</div>

<div class="modal" id="modal"><div class="panel">
  <h2 id="modalTitle">병원 편집</h2>
  <div class="field"><label>병원명</label><input id="mName" placeholder="예: 선부365정형외과"></div>
  <div class="field"><label>설명</label><input id="mDesc" placeholder="예: 관리자 시트"></div>
  <div class="field"><label>바로가기 링크</label><div id="linkEditor"></div><button class="btn" id="addLink">+ 링크 추가</button></div>
  <div class="note">※ URL은 Google Sheets뿐 아니라 웹페이지, 문서, 내부 관리 페이지 등 일반 링크도 등록할 수 있습니다.</div>
  <div class="modal-actions"><button class="btn danger" id="deleteHospital">병원 삭제</button><div class="right"><button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveModal">저장</button></div></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='jinsulHospitalHub.v2';
const defaults=[
 {name:'선부365정형외과',desc:'관리자 시트',links:[
  {label:'관리 시트 열기',url:'https://docs.google.com/spreadsheets/d/1_gW8HjHJLU_duCBe8cYSkedB6EBP2RWK7Zn33A8ifHY/edit?gid=208915118#gid=208915118',primary:true},
  {label:'일일수납',url:'https://docs.google.com/spreadsheets/d/1YNVj1E2NG1zoiZFHlbRXW2kOh0yOYq1VtxogmjbRsT0/edit?gid=303216376#gid=303216376'},
  {label:'예약관리',url:'https://docs.google.com/spreadsheets/d/1_igcN8NHV5Gp9b9cBBh0rFwRvV7qJK2kufir6J3nORQ/edit?gid=1846981041#gid=1846981041'},
  {label:'비급여현황',url:'https://docs.google.com/spreadsheets/d/1IVfMsRE2R9oU6yxOcb8rYChtFZZ1wOvBCD4UQ445Amc/edit?gid=349918578#gid=349918578'}]},
 {name:'화정바로365정형외과',desc:'관리자 시트',links:[
  {label:'관리 시트 열기',url:'https://docs.google.com/spreadsheets/d/18X3J2TnQRucv22r3DuOzYTsY_rtCYbsZY0fmK9NOk20/edit?gid=208915118#gid=208915118',primary:true},
  {label:'일일수납',url:'https://docs.google.com/spreadsheets/d/1k5Tj-JE71xId5BwQ9X3rDy2kcUxx4bvNkmmLJsypXfM/edit?gid=127577238#gid=127577238'},
  {label:'예약관리',url:'https://docs.google.com/spreadsheets/d/1HgpBRRnIVRL9IT0eSsNK3RF7LrU56976TsD3hsUt_KA/edit?gid=787524447#gid=787524447'},
  {label:'비급여현황',url:'https://docs.google.com/spreadsheets/d/19zado2RdPgsbUQ3Bez9nbHgzmm0jayIGTNfeoXqcADo/edit?gid=1354715354#gid=1354715354'}]}
];
let hospitals=load(), editing=false, editIndex=null;
const $=id=>document.getElementById(id), grid=$('grid'), empty=$('empty'), search=$('search'), app=$('app'), modal=$('modal'), linkEditor=$('linkEditor');
function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(x)?x:clone(defaults)}catch(e){return clone(defaults)}}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(hospitals))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function render(){const q=search.value.trim().toLowerCase();const rows=hospitals.map((h,i)=>({h,i})).filter(x=>(x.h.name+' '+(x.h.desc||'')+' '+x.h.links.map(l=>l.label).join(' ')).toLowerCase().includes(q));grid.innerHTML=rows.map(({h,i},n)=>`<section class="card"><div class="num">HOSPITAL ${String(n+1).padStart(2,'0')}</div><div class="name">${esc(h.name)}</div><div class="desc">${esc(h.desc||'')}</div><div class="actions">${h.links.map(l=>`<a class="btn ${l.primary?'primary':''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('')}</div><div class="edit-card-actions"><button class="btn" onclick="openEdit(${i})">병원/링크 수정</button><button class="btn" onclick="moveHospital(${i},-1)">← 앞으로</button><button class="btn" onclick="moveHospital(${i},1)">뒤로 →</button></div></section>`).join('');empty.style.display=rows.length?'none':'block'}
function setEditing(v){editing=v;app.classList.toggle('editing',v);$('editToggle').textContent=v?'편집 종료':'편집 모드';render()}
function linkRow(l={label:'',url:'',primary:false}){const d=document.createElement('div');d.className='linkrow';d.innerHTML=`<div class="linkgrid"><input class="lLabel" placeholder="버튼명" value="${esc(l.label)}"><input class="lUrl" placeholder="https://..." value="${esc(l.url)}"></div><div class="row-actions"><label class="check"><input class="lPrimary" type="checkbox" ${l.primary?'checked':''}> 대표 버튼(진한색)</label><button class="btn danger removeLink" type="button">삭제</button></div>`;d.querySelector('.removeLink').onclick=()=>d.remove();linkEditor.appendChild(d)}
window.openEdit=function(i){editIndex=i;const h=hospitals[i];$('modalTitle').textContent='병원 편집';$('mName').value=h.name;$('mDesc').value=h.desc||'';linkEditor.innerHTML='';h.links.forEach(linkRow);$('deleteHospital').style.display='inline-flex';modal.classList.add('open')}
function openAdd(){editIndex=null;$('modalTitle').textContent='병원 추가';$('mName').value='';$('mDesc').value='관리자 시트';linkEditor.innerHTML='';linkRow({label:'관리 시트 열기',url:'',primary:true});$('deleteHospital').style.display='none';modal.classList.add('open')}
function closeModal(){modal.classList.remove('open')}
function collect(){const links=[...linkEditor.querySelectorAll('.linkrow')].map(r=>({label:r.querySelector('.lLabel').value.trim(),url:r.querySelector('.lUrl').value.trim(),primary:r.querySelector('.lPrimary').checked})).filter(l=>l.label||l.url);return{name:$('mName').value.trim(),desc:$('mDesc').value.trim(),links}}
window.moveHospital=function(i,d){const j=i+d;if(j<0||j>=hospitals.length)return;[hospitals[i],hospitals[j]]=[hospitals[j],hospitals[i]];save();render();toast('순서를 변경했습니다.')}
$('editToggle').onclick=()=>setEditing(!editing);$('addHospital').onclick=openAdd;$('addLink').onclick=()=>linkRow();$('cancelModal').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};search.oninput=render;
$('saveModal').onclick=()=>{const h=collect();if(!h.name)return alert('병원명을 입력해주세요.');if(editIndex===null)hospitals.push(h);else hospitals[editIndex]=h;save();closeModal();render();toast('저장했습니다.')};
$('deleteHospital').onclick=()=>{if(editIndex===null)return;if(confirm(`“${hospitals[editIndex].name}” 병원을 삭제할까요?`)){hospitals.splice(editIndex,1);save();closeModal();render();toast('삭제했습니다.')}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),hospitals},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JINSUL_병원관리허브_설정.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('설정을 내보냈습니다.')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const arr=Array.isArray(data)?data:data.hospitals;if(!Array.isArray(arr))throw Error();if(confirm('현재 설정을 가져온 설정으로 교체할까요?')){hospitals=arr;save();render();toast('설정을 가져왔습니다.')}}catch(err){alert('올바른 설정 JSON 파일이 아닙니다.')}e.target.value=''};
render();
</script>
</body>
</html>
